name: Go Microservice Pipeline

on:
  push:
    branches:
      - sit
      - uat
    tags:
      - 'v*.*.*' # Triggers on release tags (e.g., v1.0.0)

jobs:
  build-and-test:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x' 
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Code Formatter Check
        run: |
          # Memastikan semua kode sudah diformat standar Go
          if [ -n "$(go fmt ./...)" ]; then
            echo "Error: Ada kode yang belum di-format. Jalankan 'go fmt ./...' di lokal."
            exit 1
          fi

      - name: Run Go Vet (Built-in Linter)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race ./...

      - name: Build Binary
        run: go build -o ./bin/api ./cmd/api/main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: ./bin/api

  deploy-sit:
    name: Deploy to SIT
    needs: build-and-test
    if: github.ref == 'refs/heads/sit'
    runs-on: ubuntu-latest
    environment: sit
    steps:
      - name: Deploy to SIT Server
        run: echo "Executing SIT Deployment Script..."

  deploy-uat:
    name: Deploy to UAT
    needs: build-and-test
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Deploy to UAT Server
        run: echo "Executing UAT Deployment Script..."

  deploy-master:
    name: Deploy to Production
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Extract Tag Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        
      - name: Deploy to Production Server
        run: 'echo "Deploying Production release: ${{ env.VERSION }}"'